name: Arch package

on:
  workflow_dispatch:
  push:
    branches: [main]
    tags: ['v*']

permissions:
  contents: read

concurrency:
  group: package-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: '1.3.13'
      - name: Validate release version
        env:
          REF_TYPE: ${{ github.ref_type }}
          REF_NAME: ${{ github.ref_name }}
        run: |
          version=$(cat VERSION)
          [[ "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]
          if [[ "$REF_TYPE" == tag ]]; then
            [[ "$REF_NAME" == "v$version" ]] || { echo 'Tag must match VERSION'; exit 1; }
          fi
      - name: Make room for the CUDA toolchain
        run: |
          # These are unused preinstalled SDKs on the disposable GitHub runner.
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL
          df -h /
      - name: Build and check in Arch Linux
        run: |
          docker run --rm \
            --mount "type=bind,source=$GITHUB_WORKSPACE,target=/src" \
            --mount "type=bind,source=$(command -v bun),target=/usr/local/bin/bun,readonly" \
            --workdir /src archlinux:base bash scripts/ci-arch.sh
      - name: Upload installable package and checksum
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        with:
          name: afk-arch-x86_64
          path: |
            dist/*.pkg.tar.zst
            dist/*.sha256
          if-no-files-found: error
          compression-level: 0
          retention-days: 30
      - name: Upload native build diagnostics on failure
        if: failure()
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        with:
          name: native-build-diagnostics
          path: |
            work/package-runtime/nemotron-prepare.log
            work/package-runtime/**/CMakeConfigureLog.yaml
          if-no-files-found: ignore

  draft-release:
    if: github.ref_type == 'tag'
    needs: build
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7
        with:
          name: afk-arch-x86_64
          path: dist
      - name: Attach package to a draft release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          TAG: ${{ github.ref_name }}
        run: |
          if draft=$(gh release view "$TAG" --json isDraft --jq .isDraft 2>/dev/null); then
            [[ "$draft" == true ]] || { echo 'Refusing to replace a published release'; exit 1; }
            gh release upload "$TAG" dist/* --clobber
          else
            gh release create "$TAG" dist/* --verify-tag --draft \
              --title "AFK $TAG" --generate-notes
          fi
